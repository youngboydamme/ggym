<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GGym">
<meta name="theme-color" content="#f2f0eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>GGym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: gọn, chắc tay, như cuốn sổ ghi tạ ở phòng gym
   IDEA: đĩa tạ bumper — tuần tập là một hàng đĩa, kỷ lục là đĩa vàng
   PICTURE: hàng 7 đĩa của tuần ở trang chủ; bảng set lớn khi đang tập
   COLOUR and TYPE: than chì / phấn trắng, đỏ đĩa 25kg làm điểm nhấn, xanh lá cho set xong; Barlow Condensed cho số, Be Vietnam Pro cho chữ
   LAYOUT: một cột tối đa 640px, thanh tab dưới, sheet trượt từ dưới lên */
:root{--fc:'Barlow Condensed',system-ui,-apple-system,'Helvetica Neue',sans-serif;--bg:#f2f0eb;--card:#fff;--card2:#ebe8e1;--line:#ddd8ce;--ink:#17191e;--mute:#62666e;--red:#d23a40;--red2:#a92c31;--yel:#c98f00;--grn:#1f8f5b;--grnbg:#dcf1e5;--sh:0 1px 2px rgba(20,20,20,.06);color-scheme:light;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101215;--card:#1a1d22;--card2:#262a32;--line:#2e333c;--ink:#edebe6;--mute:#9a9fa9;--red:#e5484d;--red2:#a83035;--yel:#f0b72f;--grn:#34b477;--grnbg:#15301f;--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#101215;--card:#1a1d22;--card2:#262a32;--line:#2e333c;--ink:#edebe6;--mute:#9a9fa9;--red:#e5484d;--red2:#a83035;--yel:#f0b72f;--grn:#34b477;--grnbg:#15301f;--sh:none;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Be Vietnam Pro',system-ui,-apple-system,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.bc{font-family:var(--fc);font-variant-numeric:tabular-nums}
#view{max-width:640px;margin:0 auto;padding:0 16px calc(150px + var(--sb))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(var(--st) + 10px) 0 10px;background:var(--bg)}
.top h1{flex:1;margin:0;font:700 34px/1.05 var(--fc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top h1.sm{font-size:24px;line-height:1.1;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.icon{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--ink);font-size:20px;font-weight:600}
.icon svg{width:24px;height:24px}
.icon:active,.chip:active,.btn:active{filter:brightness(.92)}
.btn{min-height:48px;padding:0 18px;border-radius:12px;background:var(--card2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
a.btn{color:var(--ink);text-decoration:none}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--mute)}
.btn.danger,.danger{color:var(--red)}
.btn.block{display:flex;width:100%;margin-top:10px}
.btn.sm{min-height:40px;padding:0 16px}
.link{min-height:44px;padding:0 8px;color:var(--mute);font-weight:500}
.link.strong{color:var(--red);font-weight:700}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);margin-top:12px}
h2{font:700 24px/1.1 var(--fc),sans-serif;margin:28px 0 2px}
.lbl{font-size:13px;color:var(--mute);margin:18px 0 8px;font-weight:600}
.mute{color:var(--mute)}.small{font-size:13px}
.empty{color:var(--mute);text-align:center;padding:28px 12px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:12px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;background:var(--card2);font-size:15px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.search,.field{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
.field.big{font-size:22px;font-weight:600;height:56px;margin-top:6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
/* home */
.week{margin-top:12px;background:var(--card);border-radius:20px;padding:18px 12px 14px;box-shadow:var(--sh)}
.plates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.pl i{display:block;width:min(42px,10.5vw);aspect-ratio:1;margin:0 auto 6px;border-radius:50%;border:2px dashed var(--line)}
.pl.on i{border:0;background:radial-gradient(circle,var(--card) 0 15%,var(--ink) 16% 23%,var(--red) 24% 63%,var(--red2) 64% 71%,var(--red) 72%);box-shadow:0 2px 0 var(--red2)}
.pl span{font-size:13px;color:var(--mute)}
.pl.today span{color:var(--ink);font-weight:700}
.pl.today:not(.on) i{border:2px solid var(--ink)}
.wsum{display:flex;gap:26px;margin:14px 6px 0;font-size:13px;color:var(--mute)}
.wsum b{font:700 30px/1 var(--fc);color:var(--ink);display:block;font-variant-numeric:tabular-nums}
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;margin-top:12px}
.hero small{opacity:.7;font-size:13px}
.hero h3{font:700 44px/1 var(--fc);margin:4px 0 8px}
.hero p{margin:0 0 6px;opacity:.82;font-size:14px}
.hero .btn.red{margin-top:12px}
.hero .btn.alt{background:rgba(127,127,127,.28);color:inherit}
.rc-h{display:flex;align-items:center;gap:8px}
.rc-h b{flex:1;font-size:18px}
.days{font-size:13px;color:var(--mute);white-space:nowrap}
.rc p{margin:0 0 2px;font-size:14px;color:var(--mute)}
.hint{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:12px 6px 12px 14px;margin-top:12px;font-size:14px;display:flex;gap:6px;align-items:flex-start}
.hint p{margin:0;flex:1}
/* workout */
.top.wk{justify-content:space-between}
.wk-t{text-align:center;line-height:1.1}
.wk-t b{font:700 30px/1 var(--fc);font-variant-numeric:tabular-nums;display:block}
.wk-t small{font-size:13px;color:var(--mute)}
.wk-name{width:100%;border:0;background:none;font:700 32px/1.1 var(--fc),sans-serif;padding:4px 0;outline:none}
.wk-stats{display:flex;gap:18px;color:var(--mute);font-size:14px}
.wk-stats b{color:var(--ink);font:700 22px var(--fc);font-variant-numeric:tabular-nums}
.ex-h{display:flex;align-items:center;gap:6px}
.ex-name{flex:1;text-align:left;font-weight:700;font-size:17px;color:var(--red);min-height:40px;line-height:1.25}
.ex-sub{font-size:13px;color:var(--mute);margin:-2px 0 8px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 72px 60px 44px;gap:6px;align-items:center;padding:4px;border-radius:10px;margin:0 -4px}
.row.hd{font-size:13px;color:var(--mute);font-weight:600;padding-block:0}
.row.hd span{text-align:center}.row.hd span:nth-child(2){text-align:left}
.row input{width:100%;height:44px;border:0;border-radius:9px;background:var(--card2);text-align:center;font:600 20px var(--fc),sans-serif;font-variant-numeric:tabular-nums;padding:0 4px}
.row input::placeholder{color:var(--mute);opacity:.55}
.setno{height:40px;border-radius:9px;font:700 19px var(--fc);color:var(--ink)}
.setno.wu,.wu{color:var(--yel)}
.prev{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chk{width:44px;height:44px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--mute)}
.chk svg{width:22px;height:22px}
.row.done{background:var(--grnbg)}
.row.done input{background:transparent}
.row.done .chk{background:var(--grn);color:#fff}
/* bars */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sb));width:min(608px,calc(100% - 24px));z-index:20;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:6px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#rest .rp{position:absolute;left:0;top:0;height:4px;width:100%}
#rest .rp i{display:block;height:100%;background:var(--red);transition:width .5s linear}
#rest .rl{font-size:13px;opacity:.7}
#rest b{font:700 32px/1 var(--fc);flex:1;font-variant-numeric:tabular-nums}
#rest button{min-height:44px;min-width:50px;padding:0 10px;border-radius:10px;background:rgba(127,127,127,.3);color:inherit;font-weight:600}
#rest[hidden],#mini[hidden],body:not(.in-wk) #rest{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--mute)}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--red);font-weight:600}
body.in-wk .tabs,body.in-wk #mini{display:none}
#mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + var(--sb));width:min(608px,calc(100% - 24px));z-index:14;background:var(--red);color:#fff;border-radius:14px;min-height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22)}
#mini span{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#mini b{font:700 24px var(--fc);font-variant-numeric:tabular-nums}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 18px calc(24px + var(--sb));animation:up .22s ease-out;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#sheet .panel.tall{height:88vh}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
#sheet h3{font:700 28px/1.1 var(--fc);margin:6px 0 10px}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.list{display:flex;flex-direction:column;margin-top:14px;border-radius:14px;overflow:hidden;background:var(--card)}
.list>button{min-height:54px;text-align:left;padding:0 16px;border-bottom:1px solid var(--line);font-weight:500}
.list>button:last-child{border:0}
.plist .pg{font-size:13px;color:var(--mute);font-weight:600;margin:16px 0 2px}
.plist button{display:flex;width:100%;min-height:50px;align-items:center;justify-content:space-between;gap:10px;text-align:left;border-bottom:1px solid var(--line);padding:0 2px}
.plist small{color:var(--mute);font-size:13px;white-space:nowrap}
.cf{font-size:17px;margin:8px 0 16px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:15px;font-weight:500;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
/* history */
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2)}
.heat i.on{background:var(--red)}
.heat i.fu{opacity:.25}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles>div{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.tiles b{display:block;font:700 clamp(24px,7vw,30px)/1.05 var(--fc);font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles span{font-size:13px;color:var(--mute)}
.card .tiles>div{background:var(--card2);box-shadow:none}
.mon{font:700 19px var(--fc);color:var(--mute);margin:24px 0 -4px}
.wc{cursor:pointer;display:block}
.wc-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wc-h b{font-size:17px}
.wc-h span{font-size:13px;color:var(--mute);white-space:nowrap}
.wc-m{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute);margin:2px 0 8px}
.pr{color:var(--yel);font-weight:700}
.wc ul{list-style:none;margin:0;padding:0;font-size:14px}
.wc li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.wc li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc li small{color:var(--mute);white-space:nowrap;font-size:13px}
/* exercises */
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;border-bottom:1px solid var(--line);cursor:pointer}
.li small{display:block;color:var(--mute);font-size:13px}
.li .pv{font:700 21px var(--fc);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin:18px 0 8px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fig{position:relative;height:230px;background:var(--card);border-radius:16px;touch-action:pan-y;box-shadow:var(--sh)}
.fig svg{position:absolute;inset:0;display:block}
.rec{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border-radius:14px;overflow:hidden}
.rec td{padding:10px 14px;border-bottom:1px solid var(--line)}
.rec tr:last-child td{border:0}
.rec td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.sess{padding:10px 0;border-bottom:1px solid var(--line)}
.sess b{font-size:14px}
.sess p{margin:2px 0 0;font-size:15px;font-variant-numeric:tabular-nums}
/* body */
.bform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bform label{font-size:13px;color:var(--mute);font-weight:600;display:flex;flex-direction:column;gap:4px}
.bform label.full,.bform .btn{grid-column:1/-1}
.bform input{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);padding:0 12px;font-size:18px;color:var(--ink);width:100%}
.brow{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line);cursor:pointer}
.brow span{flex:1}
.brow b{font:700 22px var(--fc);font-variant-numeric:tabular-nums}
.brow small{color:var(--mute);font-size:14px;min-width:64px;text-align:right}
/* routine editor */
.ri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.ri-n small{display:block;color:var(--mute);font-size:13px}
.ri-a{grid-column:1/-1;display:flex;gap:4px;justify-content:flex-end;margin:-6px -6px -6px 0}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:10px;background:var(--card2);font-size:20px;font-weight:600}
.step span{min-width:54px;text-align:center;font-weight:600;font-size:15px}
/* settings */
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.sw{width:52px;height:32px;flex:none;border-radius:16px;background:var(--card2);position:relative;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw.on{background:var(--grn);border-color:var(--grn)}
.sw.on::after{left:22px}
label.btn{cursor:pointer;position:relative}
/* summary + detail */
.prs{list-style:none;padding:0;margin:0}
.prs li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.avbtn{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 19px/1 var(--fc);color:var(--t);background:radial-gradient(circle,transparent 0 58%,rgba(0,0,0,.18) 59% 66%,transparent 67%),var(--c);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.av.big{width:48px;height:48px;font-size:24px}
.plist2{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:14px;padding:4px 4px 4px 0;box-shadow:var(--sh)}
.prow.on{box-shadow:inset 0 0 0 2px var(--red)}
.pbtn{flex:1;display:flex;align-items:center;gap:12px;min-height:64px;padding:0 12px;text-align:left;min-width:0}
.pbtn>span:nth-child(2){flex:1;min-width:0}
.pbtn b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn small{display:block;color:var(--mute);font-size:13px}
.pbtn i{font-style:normal;font-size:13px;font-weight:600;color:var(--red);white-space:nowrap}
.colchip{display:inline-flex;align-items:center;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.medal{grid-row:span 2;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 18%,var(--yel) 20% 66%,#9c6f00 68% 74%,var(--yel) 76%)}
.prs small{grid-column:2;color:var(--mute);font-size:13px}
.prs b{grid-row:1/3;grid-column:3;font:700 21px var(--fc);white-space:nowrap}
.dx{padding:10px 0;border-bottom:1px solid var(--line)}
.dx ol{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:2px}
.dx li{display:flex;gap:10px;font-variant-numeric:tabular-nums}
.sn{width:22px;color:var(--mute);font-weight:600}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.th{width:52px;height:38px;flex:none;border-radius:8px;object-fit:cover;background:#fff;display:block}
.th.none{display:grid;place-items:center;background:var(--card2);color:var(--mute);font-weight:700;font-size:15px}
.exth{flex:none;border-radius:8px;line-height:0}
.lim,.pi{display:flex;align-items:center;gap:12px;min-width:0}
.pi>span{overflow:hidden;text-overflow:ellipsis}
.demo{position:relative;aspect-ratio:3/2;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo img+img{animation:flip 2.4s steps(1,end) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.demo.nodemo{background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mute);text-align:center;padding:16px;aspect-ratio:3/1.4}
.demo.nodemo p{margin:0}
.cues{margin:14px 0 0;padding:0;list-style:none;counter-reset:c;display:grid;gap:8px}
.cues li{counter-increment:c;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:15px;line-height:1.45}
.cues li::before{content:counter(c);width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font:700 15px/26px var(--fc);text-align:center}
@media (prefers-reduced-motion:reduce){.demo{aspect-ratio:3/1}.demo img{position:static;width:50%;height:100%;float:left}.demo img+img{animation:none}#sheet .panel{animation:none}#rest .rp i,#toast,.sw::after{transition:none}}
@media (max-width:360px){.row{grid-template-columns:30px minmax(0,1fr) 64px 54px 42px;gap:4px}.prev{font-size:13px}}

</div>

  <button data-act="tab" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Tập</button>
  <button data-act="tab" data-t="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Lịch sử</button>

</div></nav>

<div id="toast" role="status" aria-live="polite"></div>
<script>
{
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
const r1=n=>Math.round(n*10)/10;
const fx=n=>String(Math.round(n*100)/100).replace('.',',');
const fmtNum=(n,d=1)=>Math.abs(n)>=1000?Math.round(n).toLocaleString('vi-VN'):fx(Math.round(n*10**d)/10**d);
const fmtVol=n=>Math.round(n).toLocaleString('vi-VN');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().trim();
const DAY=['CN','T2','T3','T4','T5','T6','T7'];
const DAYF=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const pad=n=>String(n).padStart(2,'0');
const dm=ts=>{const d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1)};
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtDate=ts=>{const d=new Date(ts);return DAY[d.getDay()]+', '+dm(ts)+(d.getFullYear()!==new Date().getFullYear()?'/'+d.getFullYear():'')};
const fmtClock=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+pad(m)+':'+pad(x):m+':'+pad(x)};
const fmtMin=ms=>{const m=Math.max(1,Math.round(ms/60000));return m>=60?Math.floor(m/60)+' giờ '+(m%60?m%60+' phút':''):m+' phút'};
const durS=ms=>{if(ms<30000)return '0';const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+'g'+(m%60?pad(m%60):''):m+'p'};
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const startOfWeek=now=>{const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d};
const epley=(w,r)=>r<=0?0:r===1?w:w*(1+r/30);
const ICON={
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 cog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- seed data ---------- */
const GROUPS=['Ngực','Lưng','Vai','Tay trước','Tay sau','Chân','Mông','Bụng','Khác'];
const EX0=[
['bench','Bench Press (Barbell)','Ngực'],['incl-db','Incline Bench Press (Dumbbell)','Ngực'],['db-bench','Bench Press (Dumbbell)','Ngực'],
['incl-bb','Incline Bench Press (Barbell)','Ngực'],['chest-press','Chest Press (Machine)','Ngực'],['cable-fly','Cable Fly Crossovers','Ngực'],
['pec-deck','Butterfly (Pec Deck)','Ngực'],['dip','Chest Dip','Ngực'],['pushup','Push Up','Ngực'],
['ohp','Overhead Press (Barbell)','Vai'],['db-sp','Shoulder Press (Dumbbell)','Vai'],['lat-raise','Lateral Raise (Dumbbell)','Vai'],
['cable-lat','Lateral Raise (Cable)','Vai'],['face-pull','Face Pull','Vai'],['rear-fly','Rear Delt Reverse Fly (Dumbbell)','Vai'],
['pushdown','Triceps Pushdown','Tay sau'],['oh-ext','Overhead Triceps Extension (Cable)','Tay sau'],['skull','Skullcrusher (Barbell)','Tay sau'],
['db-curl','Bicep Curl (Dumbbell)','Tay trước'],['bb-curl','Bicep Curl (Barbell)','Tay trước'],['hammer','Hammer Curl (Dumbbell)','Tay trước'],
['preacher','Preacher Curl (Machine)','Tay trước'],['cable-curl','Bicep Curl (Cable)','Tay trước'],
['deadlift','Deadlift (Barbell)','Lưng'],['pullup','Pull Up','Lưng'],['chinup','Chin Up','Lưng'],['pulldown','Lat Pulldown (Cable)','Lưng'],
['bb-row','Bent Over Row (Barbell)','Lưng'],['cable-row','Seated Cable Row - V Grip (Cable)','Lưng'],['db-row','Dumbbell Row','Lưng'],
['tbar','T Bar Row','Lưng'],['shrug','Shrug (Dumbbell)','Lưng'],
['squat','Squat (Barbell)','Chân'],['legpress','Leg Press (Machine)','Chân'],['hack','Hack Squat (Machine)','Chân'],
['rdl','Romanian Deadlift (Barbell)','Chân'],['leg-curl','Lying Leg Curl (Machine)','Chân'],['seat-curl','Seated Leg Curl (Machine)','Chân'],
['leg-ext','Leg Extension (Machine)','Chân'],['bss','Bulgarian Split Squat','Chân'],['lunge','Lunge (Dumbbell)','Chân'],
['goblet','Goblet Squat','Chân'],['calf','Standing Calf Raise (Machine)','Chân'],
['hip-thrust','Hip Thrust (Barbell)','Mông'],['abduct','Hip Abduction (Machine)','Mông'],
['hlr','Hanging Leg Raise','Bụng'],['cable-crunch','Cable Crunch','Bụng'],['crunch','Crunch','Bụng']
];
const R0=[
 ['Push',[1],[['bench',4],['incl-db',3],['ohp',3],['lat-raise',3],['pushdown',3],['oh-ext',2]]],
 ['Legs',[3],[['squat',4],['rdl',3],['legpress',3],['leg-curl',3],['leg-ext',3],['calf',4]]],
 ['Upper nhẹ',[4],[['incl-db',3],['pulldown',3],['db-sp',3],['cable-row',3],['db-curl',2],['pushdown',2]]],
 ['Pull',[5],[['deadlift',3],['pullup',3],['bb-row',3],['pulldown',3],['face-pull',3],['db-curl',3],['hammer',2]]]
];
const seed=()=>({v:1,exercises:EX0.map(([id,name,group])=>({id,name,group})),
 routines:R0.map(([name,days,items])=>({id:uid(),name,days,items:items.map(([exId,sets])=>({exId,sets}))})),
 workouts:[],body:[],active:null,restBy:{},settings:{rest:90,sound:true,wake:true,hintOff:false}});

/* ---------- storage ---------- */
/* storage: giữ nguyên khoá 'sota.*' từ trước khi đổi tên app để không mất dữ liệu.
   profiles: hồ sơ đầu tiên dùng đúng khoá cũ 'sota.v1' nên dữ liệu sẵn có không phải di chuyển */
const PKEY='sota.profiles',keyOf=id=>id==='main'?'sota.v1':'sota.v1.'+id;
const PC=['#d23a40','#2c66d6','#e3a600','#1f8f5b','#e8e6e1','#3a3f48'],PCN=['Đỏ','Xanh dương','Vàng','Xanh lá','Trắng','Xám'];
let P=null,D=null,canStore=true;
try{P=JSON.parse(localStorage.getItem(PKEY)||'null')}catch(e){}
if(!P||!Array.isArray(P.list)||!P.list.length)P={list:[{id:'main',name:'Tôi',color:0}],cur:'main'};
if(!P.list.some(x=>x.id===P.cur))P.cur=P.list[0].id;
let KEY=keyOf(P.cur);
const curP=()=>P.list.find(x=>x.id===P.cur)||P.list[0];
const multi=()=>P.list.length>1;
function saveP(){try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}}
try{D=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){canStore=false}
const fix=x=>{x.del=x.del||{};x.exercises=x.exercises||[];x.routines=x.routines||[];x.workouts=x.workouts||[];x.body=x.body||[];x.restBy=x.restBy||{};
 x.settings=Object.assign({rest:90,sound:true,wake:true,hintOff:false},x.settings||{});x.workouts.sort((a,b)=>b.start-a.start);return x};
D=(D&&Array.isArray(D.workouts))?fix(D):seed();
let editSeq=0;
function saveRaw(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){if(canStore){canStore=false;toast('Không lưu được vào máy — hãy xuất bản sao lưu')}}}
function save(){D.mt=Date.now();D.sync=D.sync||{};D.sync.dirty=true;editSeq++;saveRaw();scheduleSync()}
const tomb=id=>{(D.del||(D.del={}))[id]=Date.now()};
let EXM=null;
function loadD(id){let x=null;try{x=JSON.parse(localStorage.getItem(keyOf(id))||'null')}catch(e){}return(x&&Array.isArray(x.workouts))?fix(x):null}
const initial=n=>{const w=String(n||'?').trim().split(/\s+/);return(w[w.length-1][0]||'?').toUpperCase()};
const avatar=(p,big)=>`<span class="av${big?' big':''}" style="--c:${PC[p.color]||PC[0]};--t:${p.color===2||p.color===4?'#17191e':'#fff'}">${esc(initial(p.name))}</span>`;
const exOf=id=>{if(!EXM)EXM=new Map(D.exercises.map(e=>[e.id,e]));return EXM.get(id)||{id,name:'(Bài tập đã xoá)',group:'Khác'}};

/* ---------- stats ---------- */
function exHistory(exId,excludeId,before){const out=[];for(const w of D.workouts){if(w.id===excludeId||(before&&w.start>=before))continue;
 let sets=null;for(const e of w.exercises)if(e.exId===exId)sets=(sets||[]).concat(e.sets);if(sets)out.push({w,sets})}return out}
function best(sets){let mw=0,e1=0,sv=0,tv=0,mr=0,bs=null;for(const s of sets){if(s.t==='w')continue;const w=+s.w||0,r=+s.r||0;if(!r)continue;
 mw=Math.max(mw,w);const e=epley(w,r);if(!bs||e>e1){bs=s;e1=e}sv=Math.max(sv,w*r);tv+=w*r;mr=Math.max(mr,r)}
 return{mw,e1,sv,tv,mr,bs}}
const wVol=w=>w.exercises.reduce((a,e)=>a+best(e.sets).tv,0);
const wSets=w=>w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.t!=='w').length,0);
function computePRs(w){const prs=[];for(const e of w.exercises){const prev=exHistory(e.exId,w.id,w.start);if(!prev.length)continue;
 const p=best(prev.flatMap(h=>h.sets)),n=best(e.sets);
 if(n.mw>p.mw)prs.push({exId:e.exId,k:'Tạ nặng nhất',v:fx(n.mw)+' kg'});
 if(n.e1>p.e1+0.05&&n.mw>0)prs.push({exId:e.exId,k:'1RM ước tính',v:fx(r1(n.e1))+' kg'});
 if(n.sv>p.sv)prs.push({exId:e.exId,k:'Set volume tốt nhất',v:fmtNum(n.sv)+' kg'});
 if(n.mw===0&&p.mw===0&&n.mr>p.mr)prs.push({exId:e.exId,k:'Nhiều reps nhất',v:n.mr+' reps'});}
 return prs}

/* ---------- ui state ---------- */
let S={tab:'home',view:null,exId:null,q:'',grp:'',pq:'',met:null,bm:'kg',draft:null,pick:null,cf:null,nxg:'Khác'};
let embed=false;try{embed=window.top!==window.self}catch(e){embed=true}
const standalone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);

const avBtn=()=>`<button class="avbtn" data-act="profiles" aria-label="Đổi người tập (${esc(curP().name)})">${avatar(curP())}</button>`;
const hdr=(title,left='',right='',sm)=>`<header class="top">${left}<h1 class="${sm?'sm':''}">${esc(title)}</h1>${right}</header>`;

function render(){
 const inWk=S.view==='workout'&&D.active;if(S.view==='workout'&&!D.active)S.view=null;
 document.body.classList.toggle('in-wk',!!inWk);
 let h;
 if(inWk)h=vWorkout();else if(S.view==='routine')h=vRoutine();
 else if(S.tab==='history')h=vHistory();else if(S.tab==='ex')h=S.exId?vExDetail():vExList();else if(S.tab==='body')h=vBody();else h=vHome();
 $('#view').innerHTML=h;
 $$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab&&S.view!=='routine'));
 const mini=$('#mini');
 if(D.active&&!inWk){mini.hidden=false;mini.innerHTML=`<span>${multi()?esc(curP().name):D.active.editId?'Đang sửa':'Đang tập'} · ${esc(D.active.name)}</span><b class="elapsed"></b>`}else mini.hidden=true;
 postRender();tick();wake();
}
function postRender(){
 const ec=$('#exchart');if(ec){const m=MET[S.met];const pts=exHistory(S.exId).slice().reverse().map(x=>({x:x.w.start,y:m.f(best(x.sets))})).filter(p=>p.y>0);chart(ec,pts,m.u)}
 const bc=$('#bodychart');if(bc){const pts=D.body.filter(b=>S.bm==='kg'?b.kg:b.bf).sort((a,b)=>a.d-b.d).map(b=>({x:b.d,y:S.bm==='kg'?b.kg:b.bf}));chart(bc,pts,S.bm==='kg'?'kg':'%')}
}

const CUES={"bench":["Ép bả vai ra sau và xuống, lưng cong nhẹ, hai chân bám chặt sàn","Hạ thanh chạm ngực dưới, khuỷu tạo góc khoảng 45–70° với thân","Đẩy lên theo đường hơi chéo về phía mặt, giữ bả vai ép suốt hiệp"],"incl-db":["Ghế nghiêng 30–45°, bả vai ép sát ghế","Hạ tạ ngang ngực trên, khuỷu nằm dưới tạ, hơi khép vào thân","Đẩy lên và hơi chụm vào, không đập hai tạ vào nhau"],"db-bench":["Đặt tạ lên đùi rồi ngả lưng để đưa tạ vào vị trí","Hạ chậm đến khi tạ ngang ngực, cảm nhận ngực giãn","Đẩy lên, cổ tay luôn thẳng phía trên khuỷu"],"incl-bb":["Ghế nghiêng 30–45°, nắm rộng hơn vai một chút","Hạ thanh xuống ngực trên, ngay dưới xương đòn","Giữ bả vai ép, đẩy thẳng lên phía trên vai"],"chest-press":["Chỉnh ghế để tay cầm ngang giữa ngực","Đẩy ra, không khoá khuỷu, lưng áp sát đệm","Về chậm 2–3 giây, không để tạ chạm chồng"],"cable-fly":["Đứng giữa hai ròng rọc, bước một chân lên trước, thân hơi đổ","Khuỷu hơi cong và giữ cố định, khép tay theo vòng cung trước ngực","Mở ra chậm đến khi ngực căng, không kéo bằng tay sau"],"pec-deck":["Chỉnh ghế để tay cầm ngang vai","Khép tay bằng lực ngực, giữ 1 giây ở giữa","Mở ra có kiểm soát, vai không chúi về trước"],"dip":["Đổ người về trước để ngực làm việc nhiều hơn","Hạ đến khi vai ngang khuỷu; dừng sớm hơn nếu đau vai","Đẩy lên, không khoá khuỷu mạnh"],"pushup":["Tay rộng hơn vai một chút, thân thẳng từ đầu tới gót","Siết bụng và mông, không võng lưng","Hạ ngực sát sàn, khuỷu khoảng 45° so với thân"],"ohp":["Nắm ngang vai, siết mông và bụng, không ngả lưng","Hơi lùi đầu ra sau để thanh đi thẳng qua mặt","Ở điểm cao nhất đưa đầu về trước, thanh nằm trên giữa bàn chân"],"db-sp":["Ngồi tựa lưng ghế, tạ ngang tai","Đẩy lên và hơi chụm, không đập hai tạ","Hạ đến khi khuỷu ngang hoặc hơi thấp hơn vai"],"lat-raise":["Khuỷu hơi cong, nâng tạ sang hai bên tới ngang vai","Dẫn bằng khuỷu, không nhún vai","Hạ chậm, không lấy đà bằng thân"],"cable-lat":["Ròng rọc đặt thấp, tay kéo nằm ở phía bên kia người","Nâng tới ngang vai, khuỷu hơi cong","Giữ cáp căng suốt hành trình, hạ chậm"],"face-pull":["Ròng rọc ngang hoặc cao hơn mặt, dùng dây thừng","Kéo về phía mặt, tách hai đầu dây, khuỷu nâng cao","Cuối động tác xoay vai ra ngoài và ép bả vai"],"rear-fly":["Gập người khoảng 45–90°, lưng thẳng","Mở tay sang hai bên, khuỷu hơi cong","Dùng vai sau, không kéo bằng lưng hay lấy đà"],"pushdown":["Khuỷu khép sát thân và giữ cố định","Đẩy xuống đến khi duỗi hẳn tay, siết tay sau","Thả lên chậm đến khi cẳng tay ngang sàn"],"oh-ext":["Quay lưng về ròng rọc, tay cầm ở sau đầu","Khuỷu hướng về trước và giữ gần đầu","Duỗi thẳng tay qua đầu, về chậm để giãn tay sau"],"skull":["Nằm trên ghế, thanh tạ trên ngực, tay duỗi thẳng","Chỉ gập khuỷu, hạ thanh về trán hoặc ra sau đầu","Cánh tay trên giữ cố định khi duỗi lên"],"db-curl":["Khuỷu sát thân, không đẩy khuỷu ra trước","Cuộn tạ lên, xoay lòng bàn tay ngửa dần","Hạ chậm hết tầm, không lấy đà bằng lưng"],"bb-curl":["Nắm rộng bằng vai, đứng thẳng, khuỷu sát thân","Cuộn lên tới ngang vai, siết bắp tay","Hạ chậm 2–3 giây, không ngả người"],"hammer":["Lòng bàn tay hướng vào nhau suốt động tác","Khuỷu sát thân, cuộn lên tới ngang vai","Hạ chậm; có thể tập luân phiên hai tay"],"preacher":["Nách sát mép đệm, cánh tay áp lên đệm","Cuộn lên, không nhấc cánh tay khỏi đệm","Hạ gần duỗi hẳn nhưng có kiểm soát"],"cable-curl":["Đứng gần ròng rọc thấp, khuỷu sát thân","Cuộn lên, giữ căng ở đỉnh 1 giây","Hạ chậm, không ngả người ra sau"],"deadlift":["Thanh tạ sát ống quyển, nằm trên giữa bàn chân","Hông cao hơn gối, lưng thẳng, siết lưng trước khi kéo","Đạp sàn bằng chân, giữ thanh sát người, đứng thẳng không ngả ra sau"],"pullup":["Nắm rộng hơn vai, treo thẳng tay","Kéo bả vai xuống trước, rồi kéo khuỷu về phía hông","Lên tới khi cằm qua xà, hạ chậm hết tầm"],"chinup":["Nắm ngửa, rộng bằng vai","Kéo ngực về phía xà, khuỷu đi xuống trước người","Hạ chậm tới khi duỗi tay"],"pulldown":["Nắm rộng, ưỡn ngực nhẹ, người hơi ngả sau","Kéo thanh về ngực trên, khuỷu đi xuống và ra sau","Thả lên chậm để lưng xô giãn"],"bb-row":["Gập người khoảng 45°, lưng thẳng, gối hơi chùng","Kéo thanh về bụng dưới, ép bả vai","Hạ có kiểm soát, giữ nguyên góc thân"],"cable-row":["Ngồi thẳng, gối hơi chùng","Kéo tay cầm về bụng, ưỡn ngực, ép bả vai","Duỗi tay về trước để giãn lưng, không gù lưng"],"db-row":["Một tay và một gối chống ghế, lưng phẳng","Kéo tạ về phía hông, khuỷu sát thân","Hạ chậm để giãn xô, không xoay thân"],"tbar":["Đứng hai bên thanh, gập người, lưng thẳng","Kéo tay cầm về ngực dưới, ép bả vai","Hạ chậm, không giật bằng hông"],"shrug":["Đứng thẳng, tay buông tạ hai bên","Nhún vai thẳng lên về phía tai, giữ 1 giây","Hạ chậm, không xoay vai thành vòng"],"squat":["Thanh tạ trên cơ thang, chân rộng bằng vai, mũi chân hơi mở","Hít sâu, siết bụng, ngồi xuống với gối đi theo hướng mũi chân","Xuống tới đùi song song sàn hoặc thấp hơn, đạp lên bằng cả bàn chân"],"legpress":["Đặt chân giữa bàn đạp, rộng bằng vai","Hạ tới khi gối khoảng 90°, lưng dưới không nhấc khỏi đệm","Đẩy lên, không khoá gối"],"hack":["Lưng và vai áp sát đệm, chân đặt hơi lên trước","Hạ sâu có kiểm soát, gối theo hướng mũi chân","Đẩy bằng gót và giữa bàn chân, không khoá gối"],"rdl":["Đứng thẳng, gối hơi chùng và giữ cố định","Đẩy hông ra sau, thanh trượt dọc đùi, lưng thẳng","Hạ tới khi đùi sau căng (thường ngang ống quyển), siết mông để đứng lên"],"leg-curl":["Đệm chặn ngay trên gót, gối nằm ở mép ghế","Cuộn gót về phía mông, hông không nhấc khỏi đệm","Hạ chậm 2–3 giây"],"seat-curl":["Tựa lưng, đệm trên đè chặt đùi","Gập gối, kéo gót xuống dưới ghế","Về chậm, không để tạ chạm chồng"],"leg-ext":["Gối thẳng hàng với trục máy, đệm đặt ở cổ chân","Duỗi thẳng chân, siết đùi trước 1 giây","Hạ chậm, không đá chân"],"bss":["Mu bàn chân sau đặt lên ghế, chân trước bước xa","Hạ thẳng người xuống, gối trước theo hướng mũi chân","Thân hơi đổ về trước để mông làm việc nhiều hơn; đẩy lên bằng chân trước"],"lunge":["Bước dài về trước, thân thẳng","Hạ tới khi gối sau gần chạm sàn, hai gối khoảng function chart(el,pts,unit){if(!el||!pts.length)return;let hi=-1,X=null;
 const draw=()=>{const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;const P={l:44,r:16,t:18,b:26},n=pts.length;
  let x0=pts[0].x,x1=pts[n-1].x;if(x1===x0){x0-=864e5;x1+=864e5}
  let y0=Infinity,y1=-Infinity;pts.forEach(p=>{y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)});const pd=(y1-y0)*.2||Math.max(1,y1*.05);y0=Math.max(0,y0-pd);y1+=pd;
  X=x=>P.l+(x-x0)/(x1-x0)*(W-P.l-P.r);const Y=y=>P.t+(1-(y-y0)/(y1-y0))*(H-P.t-P.b);
  const ticks=[0,1,2,3].map(k=>y0+(y1-y0)*k/3),dec=(y1-y0)<6?1:0;
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  const area=line+'L'+X(pts[n-1].x).toFixed(1)+' '+(H-P.b)+'L'+X(pts[0].x).toFixed(1)+' '+(H-P.b)+'Z';
  const s=pts[hi>=0?hi:n-1],sx=X(s.x),sy=Y(s.y),lab=fmtNum(s.y)+' '+unit+' · '+dm(s.x),lw=lab.length*7.2+18;

 const W7=7*864e5;let b=startOfWeek(now).getTime()+W7,a=b-W7,streak=0;const has=(x,y)=>ws.some(w=>w.start>=x&&w.start<y);
 if(!has(a,b)){b=a;a-=W7}while(has(a,b)){streak++;b=a;a-=W7}

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
 else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
 else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function parseDate(s){s=String(s||'').trim();const m=s.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?,?\s+(\d{4}),?\s+(\d{1,2}):(\d{2})/);
 if(m){const mo='janfebmaraprmayjunjulaugsepoctnovdec'.indexOf(m[2].toLowerCase())/3;if(mo>=0)return new Date(+m[3],mo,+m[1],+m[4],+m[5]).getTime()}
 const t=Date.parse(s);return isNaN(t)?null:t}
function importHevy(txt){

  const reps=parseInt(r[c.reps],10),nm=(r[c.ex]||'').trim();if(!(reps>0)||!nm)continue;
  let kg=c.kg>=0?num(r[c.kg]):(c.lb>=0?num(r[c.lb])*0.45359237:0);kg=Math.round(kg*100)/100;

 const have=new Set(D.workouts.map(w=>w.start));const all=[...map.values()].filter(w=>w.ex.length);const fresh=all.filter(w=>!have.has(w.start));
 if(!fresh.length)return toast(all.length?'Các buổi trong file đã có sẵn':'Không đọc được buổi tập nào');
 const byName=new Map(D.exercises.map(e=>[norm(e.name),e.id]));const newNames=new Set(fresh.flatMap(w=>w.ex.map(e=>e.nm)).filter(n=>!byName.has(norm(n))));
 confirmSheet(`Tìm thấy <b>${fresh.length}</b> buổi tập mới${all.length>fresh.length?` (bỏ qua ${all.length-fresh.length} buổi trùng)`:''}${newNames.size?`, kèm ${newNames.size} bài tập chưa có trong danh sách`:''}. Nhập vào?`,'Nhập lịch sử',()=>{
  const added=[];for(const w of fresh){const ws={id:uid(),u:Date.now(),name:w.name,start:w.start,end:w.end,routineId:null,src:'hevy',exercises:w.ex.map(e=>{let id=byName.get(norm(e.nm));if(!id){id=uid();const nx={id,u:Date.now(),name:e.nm,group:'Khác',custom:true},rf=autoRef(e.nm);if(rf)nx.ref=rf;D.exercises.push(nx);byName.set(norm(e.nm),id)}return{exId:id,sets:e.sets}})};D.workouts.push(ws);added.push(ws)}
  EXM=null;D.workouts.sort((a,b)=>b.start-a.start);for(const w of D.workouts)w.prs=computePRs(w);save();S.view=null;S.tab='history';render();toast('Đã nhập '+added.length+' buổi tập')})}

   lưu máy trước, có mạng thì gộp (theo id + thời điểm sửa, có danh sách đã xoá) rồi đẩy lên. */
const CLOUD0={url:'https://vawfperiksgzgdovbqjt.supabase.co',key:'sb_publishable_hK962oRny9XZbugoqath0Q_xnXqL0Dr'}; // điền URL + publishable key để ai cài app cũng có sẵn cấu hình
const cloudCfg=()=>{let c=null;try{c=JSON.parse(localStorage.getItem('ggym.cloud')||'null')}catch(e){}return(c&&c.url&&c.key)?c:(CLOUD0.url&&CLOUD0.key?CLOUD0:null)};

async function sbFetch(path,opt={},auth=true){const c=cloudCfg();if(!c)throw new Error('Chưa cấu hình Supabase');
 const h=Object.assign({apikey:c.key,'Content-Type':'application/json'},opt.headers||{});
 h.Authorization='Bearer '+(auth?await token():c.key);
 let r;try{r=await fetch(c.url.replace(/\/+$/,'')+path,Object.assign({},opt,{headers:h}))}catch(e){throw new Error('Không kết nối được Supabase')}
 const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
 if(!r.ok){const e=new Error((j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status));e.status=r.status;e.code=j&&(j.error_code||j.code);throw e}return j}
function saveSession(j){const a={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user&&j.user.id,email:j.user&&j.user.email};setAuth(a);return a}
async function token(){let a=getAuth();if(!a)throw Object.assign(new Error('Chưa đăng nhập'),{status:401});
 if(Date.now()>a.exp-60000){let j;try{j=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:a.rt})},false)}
  catch(e){if(e.status===400||e.status===401){setAuth(null);throw new Error('Phiên đăng nhập đã hết, hãy đăng nhập lại')}throw e}
  a=saveSession(j)}return a.at}
const authMsg=e=>{const m=String(e&&e.message||'');
 return /invalid login/i.test(m)?'Sai email hoặc mật khẩu':/not confirmed/i.test(m)?'Email chưa được xác nhận — mở hộp thư để xác nhận':/already registered|already exists/i.test(m)?'Email này đã có tài khoản — bấm Đăng nhập':/password/i.test(m)&&/6|short|weak/i.test(m)?'Mật khẩu cần ít nhất 6 ký tự':/rate limit|too many/i.test(m)?'Thử lại sau ít phút (giới hạn gửi email)':m}
function mergeDocs(L,R){const del=Object.assign({},R.del||{},L.del||{});const lNew=(L.mt||0)>=(R.mt||0);
 const out=Object.assign({},lNew?R:L,lNew?L:R);
 for(const k of ['workouts','body','exercises','routines']){const m=new Map();for(const x of (R[k]||[]))m.set(x.id,x);
  for(const x of (L[k]||[])){const y=m.get(x.id);if(!y||(x.u||0)>=(y.u||0))m.set(x.id,x)}
  out[k]=[...m.values()].filter(x=>!del[x.id])}
 if(L.active&&!R.active&&!lNew&&L.active.start>(R.mt||0))out.active=L.active; // buổi đang tập trên máy này mới bắt đầu sau lần sửa cuối ở máy khác
 out.del=del;out.mt=Math.max(L.mt||0,R.mt||0);delete out.sync;return fix(out)}
const isSeedRoutine=r=>!r.u&&R0.some(([n,,items])=>n===r.name&&JSON.stringify(items.map(([exId,sets])=>({exId,sets})))===JSON.stringify((r.items||[]).map(i=>({exId:i.exId,sets:i.sets}))));
const sig=x=>['workouts','body','exercises','routines'].map(k=>(x[k]||[]).map(i=>i.id+':'+(i.u||0)).sort().join(',')).join('|')+'|'+Object.keys(x.del||{}).length+'|'+(x.mt||0);

 return 'Đồng bộ lần cuối '+hm(sy.at)+', '+dm(sy.at)+(sy.dirty?' · còn thay đổi chờ gửi':'')}

async function sync(manual){
 if(syncing||!cloudCfg()||!getAuth())return;
 if(navigator.onLine===false){if(manual)toast('Đang offline — sẽ đồng bộ khi có mạng');return}
 syncing=true;S.syncErr='';setSyncSt();const pid=P.cur;let pulled=false,ok=false;
 try{await token();const uid=getAuth().uid;
  for(let i=0;i<4;i++){
   const rows=await sbFetch('/rest/v1/ggym_docs?select=doc,rev&user_id=eq.'+uid);if(P.cur!==pid)return;
   const row=rows&&rows[0],sy=D.sync||{},first=!sy.rev||sy.uid!==uid,seq=editSeq;
   if(!row){const r=await sbFetch('/rest/v1/ggym_docs?select=rev',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:uid,doc:stripD(D),rev:1})}).catch(e=>{if(e.status===409)return null;throw e});
    if(P.cur!==pid)return;if(!r)continue;D.sync={uid,rev:1,at:Date.now(),dirty:editSeq!==seq};saveRaw();ok=true;break}
   let push=!!sy.dirty&&!first;
   if(first||row.rev!==sy.rev){const R=fix(row.doc||{});
    if(first&&R.routines.length)D.routines=D.routines.filter(r=>!isSeedRoutine(r)); // bỏ routine mẫu chưa sửa để không bị trùng
    D=mergeDocs(D,R);D.sync={uid,rev:row.rev,at:sy.at,dirty:!!sy.dirty};EXM=null;pulled=true;push=sig(D)!==sig(R)}
   if(!push){D.sync=Object.assign({},D.sync,{uid,rev:row.rev,at:Date.now(),dirty:editSeq!==seq});saveRaw();ok=true;break}
   const r=await sbFetch('/rest/v1/ggym_docs?user_id=eq.'+uid+'&rev=eq.'+row.rev+'&select=rev',{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({doc:stripD(D),rev:row.rev+1})});
   if(P.cur!==pid)return;if(!r||!r.length){saveRaw();continue}
   D.sync={uid,rev:row.rev+1,at:Date.now(),dirty:editSeq!==seq};saveRaw();ok=true;break}
  if(!ok)throw new Error('Dữ liệu đang thay đổi ở máy khác, thử lại sau');
  if(pulled){const ae=document.activeElement;if(!(ae&&ae.matches&&ae.matches('input')))render()}
  if(manual)toast('Đã đồng bộ')}
 catch(e){S.syncErr=e.message;if(manual)toast('Không đồng bộ được: '+e.message)}
 finally{syncing=false;setSyncSt();if(P.cur===pid&&D.sync&&D.sync.dirty&&getAuth())scheduleSync(15000)}}

 if(!a)return `<p class="lbl">Đồng bộ đám mây</p><p class="mute small" style="margin:0 0 8px">Đăng nhập để tự sao lưu và dùng trên nhiều máy${multi()?'. Mỗi hồ sơ dùng một tài khoản riêng':''}.</p><input id="au-email" class="field" type="email" placeholder="Email" autocomplete="username" inputmode="email"><input id="au-pass" class="field" style="margin-top:8px" type="password" placeholder="Mật khẩu (ít nhất 6 ký tự)" autocomplete="current-password"><div class="row2"><button class="btn red" data-act="au-in">Đăng nhập</button><button class="btn" data-act="au-up">Tạo tài khoản</button></div><button class="link" data-act="cloud-edit">Đổi cấu hình Supabase</button>`;
 return `<p class="lbl">Đồng bộ đám mây</p><div class="card" style="margin-top:0"><b>${esc(a.email||'')}</b><p class="mute small" style="margin:2px 0 0" id="sync-st">${syncText()}</p></div><div class="row2"><button class="btn" data-act="sync-now">Đồng bộ ngay</button><button class="btn danger" data-act="au-out">Đăng xuất</button></div>`}

/* ---------- profiles ---------- */
function profStat(p){const x=p.id===P.cur?D:loadD(p.id);if(!x)return 'Chưa có buổi tập';const n=x.workouts.length,last=x.workouts[0];
 return (x.active?'Đang tập dở · ':'')+(n?n+' buổi · gần nhất '+fmtDate(last.start):'Chưa có buổi tập')}
function profilesSheet(){
 sheet(`<h3>Ai đang tập?</h3><div class="plist2">${P.list.map(p=>`<div class="prow ${p.id===P.cur?'on':''}"><button class="pbtn" data-act="p-switch" data-id="${p.id}">${avatar(p,1)}<span><b>${esc(p.name)}</b><small>${esc(profStat(p))}</small></span>${p.id===P.cur?'<i>Đang dùng</i>':''}</button><button class="icon" data-act="p-edit" data-id="${p.id}" aria-label="Sửa hồ sơ ${esc(p.name)}">${ICON.dots}</button></div>`).join('')}</div>
 <button class="btn red block" data-act="p-new">+ Thêm người tập</button>
 <p class="mute small">Mỗi người có lịch sử, routine, số đo và cài đặt riêng. Tất cả chỉ lưu trên máy này.</p>
 <p class="lbl">Bạn bè dùng trên điện thoại riêng</p><p class="mute small" style="margin:0">Gửi link để họ tự cài; dữ liệu của mỗi người nằm trên máy của họ.</p>
 <button class="btn block" data-act="share-app">Gửi link cài app</button>`,'tall')}
function profEdit(p){const isNew=!p;S.pcol=p?p.color:(P.list.length%PC.length);
 sheet(`<h3>${isNew?'Người tập mới':'Sửa hồ sơ'}</h3><input id="pf-name" class="field" value="${p?esc(p.name):''}" placeholder="Tên, ví dụ: Minh" autocomplete="off" maxlength="30">
 <p class="lbl">Màu đĩa tạ</p><div class="chips" id="pf-col">${PC.map((c,i)=>`<button class="chip colchip ${i===S.pcol?'on':''}" data-act="pf-col" data-c="${i}" aria-label="${PCN[i]}"><span class="dot" style="background:${c}"></span>${PCN[i]}</button>`).join('')}</div>
 ${isNew?`<div class="tg" style="margin-top:8px"><span>Tạo sẵn routine mẫu Push / Legs / Upper / Pull</span><button class="sw on" id="pf-seed" data-act="pf-seed" aria-pressed="true" aria-label="Routine mẫu"></button></div>`:''}
 <button class="btn red block" data-act="pf-save" data-id="${p?p.id:''}">${isNew?'Tạo và chuyển sang':'Lưu'}</button>
 ${p&&P.list.length>1?(p.id===P.cur?`<p class="mute small" style="text-align:center">Muốn xoá hồ sơ đang dùng thì chuyển sang người khác trước.</p>`:`<button class="btn block danger" style="background:none" data-act="pf-del" data-id="${p.id}">Xoá hồ sơ này</button>`):''}`)}
function switchTo(id){if(id===P.cur){closeSheet();return}save();P.cur=id;saveP();KEY=keyOf(id);D=loadD(id)||seed();EXM=null;
 S=Object.assign(S,{tab:'home',view:null,exId:null,q:'',grp:'',met:null,draft:null,pick:null,cf:null});closeSheet();render();scrollTo(0,0);toast('Đã chuyển sang '+curP().name);scheduleSync(400)}
/* ---------- actions ---------- */
const A={
 close:()=>closeSheet(),
 'cloud-edit':()=>{S.cfgEdit=true;settingsSheet()},
 'cloud-cfg':()=>{const url=($('#cf-url').value||'').trim().replace(/\/+$/,''),key=($('#cf-key').value||'').trim();
  if(!/^(https:\/\/[^\s/]+|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?)/.test(url))return toast('URL phải có dạng https://xxxx.supabase.co');if(key.length<20)return toast('Key chưa đúng');
  try{localStorage.setItem('ggym.cloud',JSON.stringify({url,key}))}catch(e){}S.cfgEdit=false;settingsSheet();toast('Đã lưu cấu hình Supabase')},
 'au-in':async()=>{const em=($('#au-email').value||'').trim(),pw=$('#au-pass').value||'';if(!em||!pw)return toast('Nhập email và mật khẩu');
  try{const j=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:em,password:pw})},false);saveSession(j);settingsSheet();toast('Đã đăng nhập, đang đồng bộ…');await sync(true);settingsSheet()}catch(e){toast(authMsg(e))}},
 'au-up':async()=>{const em=($('#au-email').value||'').trim(),pw=$('#au-pass').value||'';if(!em||pw.length<6)return toast('Nhập email và mật khẩu ít nhất 6 ký tự');
  try{const j=await sbFetch('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:em,password:pw})},false);
   if(j&&j.access_token){saveSession(j);settingsSheet();await sync(true);settingsSheet()}else toast('Đã gửi email xác nhận — bấm link trong email rồi quay lại bấm Đăng nhập')}catch(e){toast(authMsg(e))}},
 'au-out':()=>confirmSheet('Đăng xuất khỏi tài khoản đồng bộ? Dữ liệu trên máy vẫn giữ nguyên.','Đăng xuất',async()=>{try{await sbFetch('/auth/v1/logout',{method:'POST'})}catch(e){}setAuth(null);D.sync={};saveRaw();toast('Đã đăng xuất')}),
 'sync-now':()=>sync(true),

 profiles:()=>profilesSheet(),
 'p-switch':d=>switchTo(d.id),
 'p-new':()=>profEdit(null),
 'p-edit':d=>{const p=P.list.find(x=>x.id===d.id);if(p)profEdit(p)},
 'pf-col':d=>{S.pcol=+d.c;$$('#pf-col .chip').forEach(c=>c.classList.toggle('on',c.dataset.c===d.c))},
 'pf-seed':(d,b)=>{const on=!b.classList.contains('on');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)},
 'pf-save':d=>{const name=($('#pf-name').value||'').trim();if(!name)return toast('Nhập tên người tập');
  if(P.list.some(x=>x.id!==d.id&&norm(x.name)===norm(name)))return toast('Đã có hồ sơ trùng tên');
  if(d.id){const p=P.list.find(x=>x.id===d.id);p.name=name;p.color=S.pcol;saveP();closeSheet();render();toast('Đã lưu hồ sơ');return}
  const id=uid(),x=seed(),sb=$('#pf-seed');if(sb&&!sb.classList.contains('on'))x.routines=[];else x.routines.forEach(r=>r.days=[]);x.settings.hintOff=D.settings.hintOff;
  try{localStorage.setItem(keyOf(id),JSON.stringify(x))}catch(e){return toast('Bộ nhớ máy đầy, không tạo được hồ sơ')}
  P.list.push({id,name,color:S.pcol});saveP();switchTo(id)},
 'pf-del':d=>{const p=P.list.find(x=>x.id===d.id);if(!p||p.id===P.cur)return;
  confirmSheet(`Xoá hồ sơ <b>${esc(p.name)}</b> cùng toàn bộ lịch sử tập, routine và số đo của người này? Không thể hoàn tác — nếu cần, chuyển sang hồ sơ đó và xuất bản sao lưu trước.`,'Xoá hồ sơ',()=>{
   try{localStorage.removeItem(keyOf(p.id));localStorage.removeItem('ggym.auth.'+p.id)}catch(e){}P.list=P.list.filter(x=>x.id!==p.id);saveP();render();toast('Đã xoá hồ sơ '+p.name)})},
 'share-app':async()=>{const url=location.origin+location.pathname.replace(/index\.html$/,'');
  try{if(navigator.share){await navigator.share({title:'GGym',text:'App ghi buổi tập gym, mở bằng Safari rồi Thêm vào MH chính:',url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Đã chép link: '+url)}catch(e){toast('Link app: '+url)}},

 'cf-ok':()=>{const f=S.cf;S.cf=null;closeSheet();f&&f()},
 tab:d=>{if(S.view==='routine')S.view=null;if(d.t===S.tab&&S.tab==='ex')S.exId=null;S.tab=d.t;render();scrollTo(0,0)},
 settings:()=>settingsSheet(),
 'hint-off':()=>{D.settings.hintOff=true;save();render()},
 'start-empty':()=>begin({name:'Buổi tập '+partOfDay()}),
 'start-routine':d=>{const r=D.routines.find(x=>x.id===d.id);if(r)begin({name:r.name,routineId:r.id,exercises:r.items.map(it=>({exId:it.exId,sets:Array.from({length:it.sets},blank)}))})},
 resume:()=>{S.view='workout';render();scrollTo(0,0)},
 minimize:()=>{S.view=null;render()},
 check:d=>{const a=D.active,e=a.exercises[d.i],s=e.sets[d.j];
  if(!s.done){const p=prevOf(e)[d.j];if(s.w===''&&p)s.w=fx(p.w);if(s.r===''&&p)s.r=String(p.r);if(s.w==='')s.w='0';
   if(!(num(s.r)>0)){toast('Nhập số reps trước đã');s.w=s.w==='0'?'':s.w;return}
   s.done=true;if(!a.editId)startRest(D.restBy[e.exId]!=null?D.restBy[e.exId]:D.settings.rest)}else s.done=false;
  save();render()},
 addset:d=>{const sets=D.active.exercises[d.i].sets,l=sets[sets.length-1];sets.push(l?{w:l.w,r:l.r,done:false,t:'n'}:blank());save();render()},
 setmenu:d=>{const s=D.active.exercises[d.i].sets[d.j];sheet(`<h3>Set</h3><div class="list"><button data-act="settype" data-i="${d.i}" data-j="${d.j}">${s.t==='w'?'Đổi thành set thường':'Đánh dấu là set khởi động (K)'}</button><button class="danger" data-act="setdel" data-i="${d.i}" data-j="${d.j}">Xoá set này</button></div>`)},
 settype:d=>{const s=D.active.exercises[d.i].sets[d.j];s.t=s.t==='w'?'n':'w';save();closeSheet();render()},
 setdel:d=>{D.active.exercises[d.i].sets.splice(d.j,1);save();closeSheet();render()},
 exmenu:d=>{const i=+d.i,e=D.active.exercises[i],cur=D.restBy[e.exId]!=null?D.restBy[e.exId]:D.settings.rest,L=D.active.exercises.length;
  sheet(`<h3>${esc(exOf(e.exId).name)}</h3><p class="lbl">Thời gian nghỉ cho bài này</p><div class="chips">${[0,45,60,90,120,150,180,240].map(s=>`<button class="chip ${s===cur?'on':''}" data-act="exrest" data-i="${i}" data-s="${s}">${s?fmtClock(s):'Tắt'}</button>`).join('')}</div>
  <div class="list"><button data-act="exmove" data-i="${i}" data-d="-1" ${i?'':'disabled'}>Chuyển lên</button><button data-act="exmove" data-i="${i}" data-d="1" ${i<L-1?'':'disabled'}>Chuyển xuống</button><button data-act="exswap" data-i="${i}">Thay bằng bài khác</button><button class="danger" data-act="exdel" data-i="${i}">Bỏ bài này khỏi buổi tập</button></div>`)},
 exrest:d=>{D.restBy[D.active.exercises[d.i].exId]=+d.s;save();closeSheet();render()},
 exmove:d=>{const x=D.active.exercises,i=+d.i,j=i+ +d.d;if(j<0||j>=x.length)return;[x[i],x[j]]=[x[j],x[i]];save();closeSheet();render()},
 exswap:d=>{const i=+d.i;openPicker(id=>{D.active.exercises[i].exId=id;save();render()},'Thay bằng bài')},
 exdel:d=>{D.active.exercises.splice(+d.i,1);save();closeSheet();render()},
 addex:()=>openPicker(id=>{const n=Math.max(3,(exHistory(id,D.active.editId,D.active.start)[0]||{sets:[]}).sets.length);D.active.exercises.push({exId:id,sets:Array.from({length:Math.min(n,6)},blank)});save();render();setTimeout(()=>scrollTo(0,document.body.scrollHeight),60)}),
 exinfo:d=>{const id=d.id,h=exHistory(id),b=best(h.flatMap(x=>x.sets));sheet(`<h3>${esc(exOf(id).name)}</h3>${demoHtml(exOf(id))}<div class="tiles" style="margin-top:14px"><div><b>${b.mw?fx(b.mw):'—'}</b><span>Tạ nặng nhất (kg)</span></div><div><b>${b.e1&&b.mw?fx(r1(b.e1)):'—'}</b><span>1RM ước tính (kg)</span></div></div><p class="lbl">Các buổi gần nhất</p>${h.slice(0,4).map(sessHtml).join('')||'<p class="empty">Chưa tập bài này.</p>'}`,'tall')},
 'ref-pick':d=>{const e=exOf(d.id);S.refEx=d.id;S.rq=e.name.replace(/\(.*?\)/g,'').split(/\s+/).filter(w=>w.length>2).slice(0,2).join(' ');
  sheet(`<h3>Chọn hình minh hoạ</h3><p class="mute small" style="margin-top:-4px">Ảnh từ thư viện miễn phí free-exercise-db, cần có mạng ở lần xem đầu.</p><input class="search" type="search" data-f="refq" value="${esc(S.rq)}" placeholder="Tên tiếng Anh, ví dụ: cable row" autocomplete="off"><div id="reflist" class="plist">${refList()}</div>${e.ref?`<button class="btn block danger" style="background:none" data-act="ref-set" data-r="">Bỏ hình đang dùng</button>`:''}`,'tall')},
 'ref-set':d=>{const e=D.exercises.find(x=>x.id===S.refEx);if(e){if(d.r)e.ref=d.r;else delete e.ref;e.u=Date.now();save()}closeSheet();render();toast(d.r?'Đã gắn hình minh hoạ':'Đã bỏ hình')},
 pick:d=>{const cb=S.pick;S.pick=null;closeSheet();cb&&cb(d.id)},
 newex:d=>exSheet(null,!!d.p),
 nxg:d=>{S.nxg=d.g;$$('#nx-g .chip').forEach(c=>c.classList.toggle('on',c.dataset.g===d.g))},
 'nx-save':d=>{const name=($('#nx-name').value||'').trim();if(!name)return toast('Nhập tên bài tập');
  const dup=D.exercises.find(e=>norm(e.name)===norm(name)&&e.id!==d.id);if(dup)return toast('Đã có bài tập trùng tên');
  let id=d.id;if(id){const e=D.exercises.find(x=>x.id===id);e.name=name;e.group=S.nxg;e.u=Date.now()}else{id=uid();D.exercises.push({id,u:Date.now(),name,group:S.nxg,custom:true})}
  EXM=null;save();closeSheet();if(d.p&&S.pick){const cb=S.pick;S.pick=null;cb(id)}else{render();toast('Đã lưu bài tập')}},
 'ex-remove':d=>{const id=d.id,used=D.workouts.some(w=>w.exercises.some(e=>e.exId===id))||D.routines.some(r=>r.items.some(i=>i.exId===id))||(D.active&&D.active.exercises.some(e=>e.exId===id));
  if(used)return toast('Bài này đã có trong lịch sử / routine nên không xoá được');
  confirmSheet('Xoá bài tập này khỏi danh sách?','Xoá',()=>{tomb(id);D.exercises=D.exercises.filter(e=>e.id!==id);EXM=null;S.exId=null;save();render()})},
 'rest-adj':d=>{const a=D.active;if(!a||!a.restEnd)return;a.restEnd+=+d.s*1000;a.restDur=Math.max(1,a.restDur+ +d.s);if(a.restEnd<=Date.now())a.restEnd=0;save();restTick()},
 'rest-skip':()=>{if(D.active){D.active.restEnd=0;save();restTick()}},
 finish:()=>{const a=D.active;let done=0,open=0;a.exercises.forEach(e=>e.sets.forEach(s=>s.done?done++:open++));
  if(!done)return confirmSheet('Chưa có set nào được đánh dấu xong (✓). Huỷ buổi tập này luôn?','Huỷ buổi tập',()=>{D.active=null;save();S.view=null;render()});
  if(open)return confirmSheet(`Còn ${open} set chưa đánh dấu xong. Bỏ qua các set đó và lưu buổi tập?`,'Lưu buổi tập',doFinish);doFinish()},
 discard:()=>confirmSheet(D.active.editId?'Bỏ các thay đổi vừa sửa?':'Huỷ buổi tập này? Các set đã ghi sẽ mất.',D.active.editId?'Bỏ thay đổi':'Huỷ buổi tập',()=>{D.active=null;save();S.view=null;render()}),
 w2r:d=>{const w=findW(d.id);if(!w)return;D.routines.push({id:uid(),u:Date.now(),name:w.name,days:[],items:w.exercises.map(e=>({exId:e.exId,sets:Math.max(1,e.sets.filter(s=>s.t!=='w').length)}))});save();closeSheet();toast('Đã lưu thành routine');render()},

 wrepeat:d=>{const w=findW(d.id);if(w)begin({name:w.name,routineId:w.routineId,exercises:w.exercises.map(e=>({exId:e.exId,sets:e.sets.map(s=>({w:'',r:'',done:false,t:s.t||'n'}))}))})},
 wdel:d=>confirmSheet('Xoá buổi tập này khỏi lịch sử?','Xoá buổi tập',()=>{tomb(d.id);D.workouts=D.workouts.filter(w=>w.id!==d.id);save();render();toast('Đã xoá')}),
 grp:d=>{S.grp=d.g==='Tất cả'?'':d.g;render()},
 exopen:d=>{S.tab='ex';S.exId=d.id;S.met=null;render();scrollTo(0,0)},
 exback:()=>{S.exId=null;render()},
 exedit:()=>exSheet(exOf(S.exId)),
 met:d=>{S.met=d.k;render()},
 bm:d=>{S.bm=d.k;render()},
 'body-add':()=>{const kg=num($('#bw').value),bf=num($('#bf').value),v=$('#bd').value;
  if(!(kg>20&&kg<300))return toast('Nhập cân nặng hợp lệ');if(bf&&!(bf>2&&bf<70))return toast('% mỡ không hợp lệ');

  save();render()},
 'body-open':d=>{const b=D.body.find(x=>x.id===d.id);if(!b)return;sheet(`<h3>${fmtDate(b.d)}</h3><p class="cf">${fx(b.kg)} kg${b.bf?' · '+fx(b.bf)+' % mỡ':''}</p><button class="btn block danger" data-act="body-del" data-id="${b.id}">Xoá lần đo này</button><button class="btn block" data-act="close">Đóng</button>`)},
 'body-del':d=>{tomb(d.id);D.body=D.body.filter(b=>b.id!==d.id);save();closeSheet();render();toast('Đã xoá')},
 'r-new':()=>{S.draft={id:null,name:'',days:[],items:[]};S.view='routine';render();scrollTo(0,0)},

 'r-move':d=>{const x=S.draft.items,i=+d.i,j=i+ +d.d;if(j<0||j>=x.length)return;[x[i],x[j]]=[x[j],x[i]];render()},
 'r-del':d=>{S.draft.items.splice(+d.i,1);render()},
 'r-add':()=>openPicker(id=>{S.draft.items.push({exId:id,sets:3});render()}),
 'r-save':()=>{const r=S.draft;r.name=(r.name||'').trim();if(!r.name)return toast('Đặt tên cho routine');if(!r.items.length)return toast('Thêm ít nhất một bài tập');
  r.u=Date.now();if(r.id){const i=D.routines.findIndex(x=>x.id===r.id);D.routines[i]=r}else{r.id=uid();D.routines.push(r)}save();S.draft=null;S.view=null;S.tab='home';render();toast('Đã lưu routine')},
 'r-remove':()=>confirmSheet('Xoá routine này? Lịch sử tập không bị ảnh hưởng.','Xoá routine',()=>{tomb(S.draft.id);D.routines=D.routines.filter(x=>x.id!==S.draft.id);save();S.draft=null;S.view=null;render()}),
 defrest:d=>{D.settings.rest=+d.s;save();$$('[data-act=defrest]').forEach(c=>c.classList.toggle('on',c.dataset.s===d.s))},
 tgl:(d,b)=>{D.settings[d.k]=!D.settings[d.k];save();b.classList.toggle('on',D.settings[d.k]);b.setAttribute('aria-pressed',D.settings[d.k]);wake()},
 export:()=>exportData(),
 wipe:()=>confirmSheet((multi()?'Xoá toàn bộ dữ liệu của '+esc(curP().name)+' (buổi tập, routine, bài tập tự tạo, số đo)?':'Xoá toàn bộ buổi tập, routine, bài tập tự tạo và số đo trên máy này?')+' Không thể hoàn tác — nên xuất bản sao lưu trước.','Xoá hết dữ liệu',()=>{const del=Object.assign({},D.del),t=Date.now(),sy=D.sync;['workouts','body','routines'].forEach(k=>D[k].forEach(i=>del[i.id]=t));D.exercises.forEach(e=>{if(e.custom)del[e.id]=t});D=seed();D.del=del;D.sync=sy;EXM=null;save();S.view=null;S.tab='home';render();toast('Đã xoá toàn bộ dữ liệu')})
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();unlockAudio();f(b.dataset,b,e)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;
 if((f==='w'||f==='r')&&D.active){const s=D.active.exercises[t.dataset.i].sets[t.dataset.j];s[f]=t.value;save();if(s.done)updWk()}
 else if(f==='wname'&&D.active){D.active.name=t.value;save()}
 else if(f==='pickq'){S.pq=t.value;$('#picklist').innerHTML=pickList()}
 else if(f==='exq'){S.q=t.value;$('#exlist').innerHTML=exListHtml()}
 else if(f==='rname'&&S.draft){S.draft.name=t.value}
 else if(f==='refq'){S.rq=t.value;$('#reflist').innerHTML=refList()}});
document.addEventListener('change',async e=>{const t=e.target,f=t.dataset.f;if(f!=='imp-json'&&f!=='imp-hevy')return;const file=t.files&&t.files[0];if(!file)return;
 let txt='';try{txt=await file.text()}catch(err){return toast('Không đọc được file')}t.value='';if(f==='imp-json')importJSON(txt);else importHevy(txt)});
document.addEventListener('focusin',e=>{if(e.target.matches('.row input')){const t=e.target;setTimeout(()=>{try{t.select()}catch(x){}},0)}});

/* ---------- timers, sound, wake lock ---------- */
let ac=null;function unlockAudio(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){if(!D.settings.sound||!ac)return;try{[0,.28,.56].forEach((t,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=i===2?1175:880;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.35,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);o.start(s);o.stop(s+.25)})}catch(e){}}
function restTick(){const a=D.active,bar=$('#rest');if(!a||!a.restEnd){bar.hidden=true;return}
 const left=(a.restEnd-Date.now())/1000;
 if(left<=0){const late=left<-5;a.restEnd=0;save();bar.hidden=true;if(!late){beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}toast('Hết giờ nghỉ — vào set tiếp!')}return}
 bar.hidden=false;$('#rest-t').textContent=fmtClock(Math.ceil(left));$('#rest-p').style.width=Math.min(100,100*left/(a.restDur||1))+'%'}
function tick(){const a=D.active;if(a){const sec=((a.editId?a.end:Date.now())-a.start)/1000;$$('.elapsed').forEach(el=>el.textContent=fmtClock(sec))}restTick()}
setInterval(tick,500);
let wl=null;async function wake(){try{const want=D.settings.wake&&D.active&&S.view==='workout'&&document.visibilityState==='visible';
 if(want&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!want&&wl){await wl.release();wl=null}}catch(e){wl=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();wake();scheduleSync(300)}});
window.addEventListener('online',()=>scheduleSync(300));

/* ---------- boot ---------- */
if(D.active)S.view='workout';
render();
scheduleSync(600);
if(!embed&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
try{if(standalone&&navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
</script>
</body>
